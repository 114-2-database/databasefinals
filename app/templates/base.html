<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "NCCU 畢業離校檢核 通識體育版" }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="/static/css/app.css" rel="stylesheet" />
  </head>
  <body>

    {% if student %}
    <nav class="site-nav">
      <div class="container">
        <div class="nav-brand">
          <!-- 政大校徽 SVG -->
          <img src="/static/img/emblem.jpg" alt="國立政治大學校徽" width="32" height="32" style="border-radius:50%; object-fit:cover;" />
          <span class="nav-title">通識體育檢核</span>
        </div>
        <div class="nav-right">
          <span class="nav-user">{{ student.name }}</span>
          <button class="btn-upload" data-bs-toggle="modal" data-bs-target="#uploadModal">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="margin-right:5px;vertical-align:-1px">
              <path d="M8 1v9M4.5 4.5L8 1l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2 11v2.5A.5.5 0 0 0 2.5 14h11a.5.5 0 0 0 .5-.5V11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            上傳修課紀錄
          </button>
          <a class="btn-logout" href="/logout">登出</a>
        </div>
      </div>
    </nav>

    <!-- 上傳 Modal -->
    <div class="modal fade" id="uploadModal" tabindex="-1" aria-labelledby="uploadModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content upload-modal-content">
          <div class="modal-header upload-modal-header">
            <h5 class="modal-title upload-modal-title" id="uploadModalLabel">上傳修課紀錄</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
          </div>
          <div class="modal-body upload-modal-body">
            <form method="post" action="/upload" enctype="multipart/form-data" id="uploadForm">
              <div class="upload-drop-zone" id="dropZone">
                <div class="upload-icon">
                  <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                    <circle cx="20" cy="20" r="19" stroke="#19348f" stroke-width="1.5" stroke-dasharray="4 3"/>
                    <path d="M20 12v12M14 17l6-6 6 6" stroke="#19348f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M13 28h14" stroke="#19348f" stroke-width="1.5" stroke-linecap="round"/>
                  </svg>
                </div>
                <p class="upload-hint-main">拖曳 JSON 檔案到此處</p>
                <p class="upload-hint-sub">或</p>
                <label class="btn-choose-file" for="jsonFile">選擇檔案</label>
                <input type="file" id="jsonFile" name="file" accept=".json" style="display:none" onchange="showFileName(this)" />
                <p class="upload-filename" id="fileNameDisplay"></p>
              </div>
              <p class="upload-format-note">※ 請上傳系統匯出的修課紀錄 JSON 格式檔案</p>
              <div class="upload-actions">
                <button type="button" class="btn-cancel-upload" data-bs-dismiss="modal">取消</button>
                <button type="submit" class="btn-confirm-upload" id="submitBtn" disabled>確認上傳</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    {% endif %}

    <main class="main-content">
      <div class="container py-4">
        {% block content %}{% endblock %}
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
    function showFileName(input) {
      const display = document.getElementById('fileNameDisplay');
      const submitBtn = document.getElementById('submitBtn');
      if (input.files && input.files[0]) {
        display.textContent = input.files[0].name;
        submitBtn.disabled = false;
      } else {
        display.textContent = '';
        submitBtn.disabled = true;
      }
    }

    const dropZone = document.getElementById('dropZone');
    if (dropZone) {
      dropZone.addEventListener('dragover', e => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
      });
      dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
      dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file && file.name.endsWith('.json')) {
          const input = document.getElementById('jsonFile');
          const dt = new DataTransfer();
          dt.items.add(file);
          input.files = dt.files;
          showFileName(input);
        }
      });
    }
    </script>
  </body>
</html>
