<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "NCCU 畢業離校檢核 通識體育版" }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="/static/css/app.css" rel="stylesheet" />
  </head>
  <body>

    {% if student %}
    <nav class="site-nav">
      <div class="container">
        <div class="nav-brand">
          <img src="/static/img/emblem.jpg" alt="國立政治大學校徽" width="32" height="32" style="border-radius:50%; object-fit:cover;" />
          <span class="nav-title">通識體育檢核</span>
        </div>
        <div class="nav-right">
          <span class="nav-user">{{ student.name }}</span>
          <a class="btn-logout" href="/logout">登出</a>
        </div>
      </div>
    </nav>
    {% endif %}

    <main class="main-content">
      <div class="container py-4">
        {% block content %}{% endblock %}
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
  </body>
</html>
