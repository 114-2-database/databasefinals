{% extends "base.html" %}
{% block content %}
<h1 class="h4 mb-3">通識/體育明細</h1>
<table class="table table-striped">
  <thead>
    <tr>
      <th>類別</th>
      <th>項目</th>
      <th>狀態</th>
    </tr>
  </thead>
  <tbody>
    {% for row in items %}
    <tr>
      <td>{{ row.item.category }}</td>
      <td>{{ row.item.title }}</td>
      <td>
        {% if row.passed %}
        <span class="badge bg-success">完成</span>
        {% else %}
        <span class="badge bg-secondary">未完成</span>
        {% endif %}
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
